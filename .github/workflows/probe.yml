name: probe
on: workflow_dispatch
permissions: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for ua in "curl/8" "Mozilla/5.0 (uptime-check; awew-dev/uptime)"; do
            echo "== UA: $ua"; curl -s -o /dev/null -D - --max-time 15 -A "$ua" https://api.awew24.com/actuator/health | grep -i -E "^HTTP|^server|cf-mitigated|cf-ray" ; done
